<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админка PCoin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nova+Square&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans', sans-serif;
            background: #0f0f1a;
            color: #e5e7eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrap {
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #7C3AED, #4f46e5);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 14px;
            box-shadow: 0 8px 32px rgba(124,58,237,0.4);
        }
        .login-logo h1 {
            font-family: 'Nova Square', cursive;
            font-size: 1.4rem;
            color: #e5e7eb;
        }
        .login-logo p {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-top: 4px;
        }

        .login-card {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9ca3af;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: #22223b;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            color: #e5e7eb;
            padding: 11px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #7C3AED;
        }

        .error-msg {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.875rem;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #7C3AED;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-login:hover { background: #6d28d9; }
        .btn-login:active { transform: scale(0.98); }

        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #9ca3af;
        }
        .back-link a { color: #a78bfa; text-decoration: none; }
        .back-link a:hover { color: #c4b5fd; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-logo">
        <div class="login-logo-icon">🗓️</div>
        <h1>PCoin Events</h1>
        <p>Панель администратора</p>
    </div>

    <div class="login-card">
        {% if error %}
        <div class="error-msg">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Логин</label>
                <input type="text" id="username" name="username" class="form-input"
                       autocomplete="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-input"
                       autocomplete="current-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
        </form>
    </div>

    <div class="back-link">
        <a href="{{ url_for('main.calendar') }}">← Вернуться к календарю</a>
    </div>
</div>
</body>
</html>
