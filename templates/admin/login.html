<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Админка PCoin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #111109;
            color: #dde8b8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }
        .login-logo-icon {
            width: 64px;
            height: 64px;
            background: #8BBF30;
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(139,191,48,0.3);
        }
        .login-logo h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #dde8b8;
        }
        .login-logo p {
            font-size: 0.82rem;
            color: #5a6840;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        .login-card {
            background: #1c1c14;
            border: 1px solid rgba(139,191,48,0.12);
            border-radius: 20px;
            padding: 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #5a6840;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            background: #23231a;
            border: 1px solid rgba(139,191,48,0.15);
            border-radius: 10px;
            color: #dde8b8;
            padding: 11px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #8BBF30;
        }

        .error-msg {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.875rem;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #8BBF30;
            color: #111109;
            border: none;
            border-radius: 10px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-login:hover { background: #7aaa28; }
        .btn-login:active { transform: scale(0.98); }

        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.82rem;
            color: #5a6840;
        }
        .back-link a { color: #8BBF30; text-decoration: none; }
        .back-link a:hover { color: #dde8b8; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-logo">
        <div class="login-logo-icon">🗓️</div>
        <h1>PCoin Events</h1>
        <p>Панель администратора</p>
    </div>

    <div class="login-card">
        {% if error %}
        <div class="error-msg">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Логин</label>
                <input type="text" id="username" name="username" class="form-input"
                       autocomplete="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-input"
                       autocomplete="current-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
        </form>
    </div>

    <div class="back-link">
        <a href="{{ url_for('main.calendar') }}">← Вернуться к календарю</a>
    </div>
</div>
</body>
</html>
